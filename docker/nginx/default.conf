server {
    listen 80;
    server_name _;
    root /var/www/html/public;

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";

    index index.php;

    charset utf-8;

    server_tokens off;

    # Keep in sync with PHP's upload_max_filesize and the `max:2048` rule in
    # CalculateCommonProjectsController. Oversized uploads are answered like
    # that validation error, so clients always get JSON.
    client_max_body_size 2M;
    error_page 413 = @upload_too_large;

    location @upload_too_large {
        default_type application/json;
        return 422 '{"message":"The file field must not be greater than 2048 kilobytes.","errors":{"file":["The file field must not be greater than 2048 kilobytes."]}}';
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ ^/index\.php(/|$) {
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
